name: gemma_poc
description: "On-device Gemma 3n voice-to-text POC (LiteRT-LM, no cloud AI)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Model is downloaded after install (Option B). Optional local asset path:
  # assets:
  #   - assets/models/gemma-3n-E2B-it-int4.litertlm
